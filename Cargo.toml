[workspace]
resolver = "3"
members = ["crates/ferrojt", "crates/ferrojt-cli", "crates/ferrojt-python"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Read OpenJT (JT) files and convert them to glTF / USD."
repository = "https://github.com/jriegel/FerroJT"
authors = ["Joerg Riegel"]
keywords = ["jt", "openjt", "cad", "gltf", "usd"]
categories = ["parser-implementations", "graphics", "data-structures"]

[workspace.dependencies]
# internal
ferrojt = { path = "crates/ferrojt", version = "0.1.0" }

# core library
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.1"
half = "2.7"
bytemuck = { version = "1.25", features = ["derive"] }
tracing = "0.1"
rayon = "1.12"
gltf-json = { version = "1.4", features = ["extras", "names"] }
base64 = "0.22"
lzma-rs = "0.3"

# export / import
gltf = "1.4"

# apps
clap = { version = "4.6", features = ["derive", "env"] }
anyhow = "1.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.18"

# python bindings
pyo3 = { version = "0.30", features = ["abi3-py310"] }

# NOTE: `panic = "abort"` is deliberately *not* used: the Python extension catches
# panics at the FFI boundary and surfaces them as Python exceptions.
[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true
